<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성수동 혼합 투어 플래너 - 테스트</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: #f8fafc;
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .header h1 {
            margin: 0 0 1rem 0;
            color: #1f2937;
            font-size: 2rem;
        }
        
        .api-test {
            padding: 2rem;
        }
        
        .test-section {
            margin-bottom: 2rem;
            padding: 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
        
        .test-section h3 {
            margin: 0 0 1rem 0;
            color: #1f2937;
        }
        
        .test-result {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 1rem;
            margin-bottom: 1rem;
        }
        
        button:hover {
            background: #2563eb;
        }
        
        .status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 1rem;
        }
        
        .status.success {
            background: #dcfce7;
            color: #166534;
        }
        
        .status.error {
            background: #fef2f2;
            color: #dc2626;
        }
        
        .status.loading {
            background: #fef3c7;
            color: #92400e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ 성수동 혼합 투어 플래너</h1>
            <p>API 기능 테스트 페이지</p>
        </div>
        
        <div class="api-test">
            <div class="test-section">
                <h3>1. 통합 장소 목록 조회 <span id="places-status" class="status">대기 중</span></h3>
                <button onclick="testHybridPlaces()">장소 목록 테스트</button>
                <div id="places-result" class="test-result">테스트를 실행해주세요.</div>
            </div>
            
            <div class="test-section">
                <h3>2. 혼합 시스템 통계 <span id="stats-status" class="status">대기 중</span></h3>
                <button onclick="testHybridStats()">통계 테스트</button>
                <div id="stats-result" class="test-result">테스트를 실행해주세요.</div>
            </div>
            
            <div class="test-section">
                <h3>3. 투어 경로 최적화 <span id="optimize-status" class="status">대기 중</span></h3>
                <button onclick="testTourOptimize()">경로 최적화 테스트</button>
                <div id="optimize-result" class="test-result">테스트를 실행해주세요.</div>
            </div>
            
            <div class="test-section">
                <h3>4. 전체 기능 통합 테스트</h3>
                <button onclick="runAllTests()">모든 테스트 실행</button>
                <div id="all-result" class="test-result">준비됨</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://sungsuya-v2.local/wp-json/sungsuya/v2/';
        
        async function testHybridPlaces() {
            const statusEl = document.getElementById('places-status');
            const resultEl = document.getElementById('places-result');
            
            statusEl.textContent = '테스트 중...';
            statusEl.className = 'status loading';
            
            try {
                const response = await fetch(API_BASE + 'hybrid-places?limit=10');
                const data = await response.json();
                
                if (data.success) {
                    statusEl.textContent = '성공';
                    statusEl.className = 'status success';
                    resultEl.textContent = JSON.stringify(data, null, 2);
                } else {
                    statusEl.textContent = '실패';
                    statusEl.className = 'status error';
                    resultEl.textContent = '에러: ' + (data.error || '알 수 없는 오류');
                }
            } catch (error) {
                statusEl.textContent = '실패';
                statusEl.className = 'status error';
                resultEl.textContent = '네트워크 오류: ' + error.message;
            }
        }
        
        async function testHybridStats() {
            const statusEl = document.getElementById('stats-status');
            const resultEl = document.getElementById('stats-result');
            
            statusEl.textContent = '테스트 중...';
            statusEl.className = 'status loading';
            
            try {
                const response = await fetch(API_BASE + 'hybrid-stats');
                const data = await response.json();
                
                if (data.success) {
                    statusEl.textContent = '성공';
                    statusEl.className = 'status success';
                    resultEl.textContent = JSON.stringify(data, null, 2);
                } else {
                    statusEl.textContent = '실패';
                    statusEl.className = 'status error';
                    resultEl.textContent = '에러: ' + (data.error || '알 수 없는 오류');
                }
            } catch (error) {
                statusEl.textContent = '실패';
                statusEl.className = 'status error';
                resultEl.textContent = '네트워크 오류: ' + error.message;
            }
        }
        
        async function testTourOptimize() {
            const statusEl = document.getElementById('optimize-status');
            const resultEl = document.getElementById('optimize-result');
            
            statusEl.textContent = '테스트 중...';
            statusEl.className = 'status loading';
            
            try {
                // 먼저 장소 목록을 가져와서 일부 ID를 사용
                const placesResponse = await fetch(API_BASE + 'hybrid-places?limit=5');
                const placesData = await placesResponse.json();
                
                if (!placesData.success || placesData.data.length < 2) {
                    throw new Error('테스트할 장소 데이터가 충분하지 않습니다.');
                }
                
                const testPlaceIds = placesData.data.slice(0, 3).map(p => p.id);
                
                const response = await fetch(API_BASE + 'tour-optimize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        place_ids: testPlaceIds,
                        start_point: '37.5444,127.0548'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusEl.textContent = '성공';
                    statusEl.className = 'status success';
                    resultEl.textContent = JSON.stringify(data, null, 2);
                } else {
                    statusEl.textContent = '실패';
                    statusEl.className = 'status error';
                    resultEl.textContent = '에러: ' + (data.error || '알 수 없는 오류');
                }
            } catch (error) {
                statusEl.textContent = '실패';
                statusEl.className = 'status error';
                resultEl.textContent = '네트워크 오류: ' + error.message;
            }
        }
        
        async function runAllTests() {
            const resultEl = document.getElementById('all-result');
            resultEl.textContent = '전체 테스트 시작...\n';
            
            await testHybridPlaces();
            resultEl.textContent += '1. 장소 목록 테스트 완료\n';
            
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            await testHybridStats();
            resultEl.textContent += '2. 통계 테스트 완료\n';
            
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            await testTourOptimize();
            resultEl.textContent += '3. 경로 최적화 테스트 완료\n';
            
            resultEl.textContent += '\n전체 테스트 완료! 각 섹션의 결과를 확인해주세요.';
        }
        
        // 페이지 로드 시 자동으로 기본 테스트 실행
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                testHybridStats();
            }, 1000);
        });
    </script>
</body>
</html>
