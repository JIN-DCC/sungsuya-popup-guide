<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="50" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 네온 글로우 효과 -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feOffset result="offset" in="coloredBlur" dx="0" dy="0"/>
      <feFlood flood-color="#FF006E" flood-opacity="0.5"/>
      <feComposite operator="in" in2="offset"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 텍스트 섀도우 -->
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.8"/>
    </filter>
    
    <!-- 그라디언트 배경 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 배경 박스 -->
  <rect x="0" y="5" width="200" height="40" rx="20" fill="url(#bgGradient)"/>
  
  <!-- 내부 배경 (어두운 색) -->
  <rect x="2" y="7" width="196" height="36" rx="18" fill="#000000" fill-opacity="0.7"/>
  
  <!-- 성수야! 텍스트 -->
  <text x="20" y="31" font-family="'Noto Sans KR', Pretendard, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" filter="url(#textShadow)">
    성수야!
  </text>
  
  <!-- 구분선 -->
  <rect x="90" y="15" width="1" height="20" fill="#FFFFFF" opacity="0.5"/>
  
  <!-- SUNGSUYA 텍스트 -->
  <text x="100" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" fill="#FFFFFF" opacity="0.9" filter="url(#textShadow)">
    SUNGSUYA
  </text>
</svg>